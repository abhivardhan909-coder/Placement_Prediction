data:
  raw_path: data/raw/Placement_Data_Full_Class.csv
  processed_dir: data/processed
  target_column: status
  id_column: sl_no
  target_mapping:
    Not Placed: 0
    Placed: 1

split:
  test_size: 0.2
  random_state: 42

model:
  n_estimators: 200
  max_depth: 12
  random_state: 42
  class_weight: balanced

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: placement_prediction

registry:
  model_name: Placement_Prediction_Model
  decision_metric: f1_score

quality_gate:
  metric: f1_score
  minimum_value: 0.60

paths:
  preprocessor: models/preprocessor.pkl
  model: models/placement_model.pkl
  evaluation_report: reports/evaluation_report.json
  quality_gate_report: reports/quality_gate_report.json
  failure_report: reports/failure_report.json
  inference_output: outputs/placement_predictions.csv
