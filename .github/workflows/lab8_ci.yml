name: Lab 8 - MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/mlops_pipeline/**"
      - "requirements.txt"
      - "data/raw/Placement_Data_Full_Class.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    paths:
      - "config.yaml"
      - "src/mlops_pipeline/**"
      - "requirements.txt"
      - "data/raw/Placement_Data_Full_Class.csv"
      - ".github/workflows/lab8_ci.yml"
  workflow_dispatch:

jobs:
  mlops-ci:
    runs-on: ubuntu-latest
    env:
     MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run Placement Prediction MLOps Pipeline
        run: python src/mlops_pipeline/placement_prediction_pipeline.py

      - name: Build placement API image
        run: docker build -t placement-prediction-api:latest .

      - name: Start placement API container for tests
        run: docker run --detach --rm --name placement-api-test -p 8000:8000 placement-prediction-api:latest

      - name: Wait for placement API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Placement API did not become ready in time."
          exit 1

      - name: Run test suite
        run: python -m pytest

      - name: Stop placement API test container
        if: always()
        run: docker stop placement-api-test || true

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab8-ci-${{ github.run_number }}
          path: |
            artifacts/**
            reports/**
            logs/**
            outputs/**
            models/**
            mlruns/**
            deployment/**
          if-no-files-found: ignore
