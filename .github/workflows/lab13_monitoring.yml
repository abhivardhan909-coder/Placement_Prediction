name: Lab 13 - End-to-End MLOps
# Integration test: process a genuinely new incoming batch

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules are UTC; :47 UTC is :17 in Asia/Kolkata (UTC+05:30).
    - cron: "47 * * * *"

jobs:
  mlops-monitoring:
    runs-on: [self-hosted, Windows, X64]
    env:
      PYTHON_EXE: C:\Users\abhiv\AppData\Local\Programs\Python\Python311\python.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          & $env:PYTHON_EXE -m pip install -r requirements.txt

      - name: Run MLOps monitoring trigger
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE"
          & $env:PYTHON_EXE ".\src\mlops_pipeline\12_monitor_trigger.py"

      - name: Show monitoring result
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE"
          if (Test-Path ".\outputs\monitoring\monitor_trigger_report.json") {
              Get-Content ".\outputs\monitoring\monitor_trigger_report.json"
          } else {
              Write-Host "Monitoring report was not generated."
          }

      - name: Verify Kubernetes
        shell: powershell
        run: |
          kubectl get deployment churn-api
          kubectl get pods
