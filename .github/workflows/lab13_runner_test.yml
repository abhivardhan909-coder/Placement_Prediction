name: Lab 13 - Self Hosted Runner Test

on:
  push:
    branches:
      - main
      - master
      - lab13-integration
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64, placement-prediction]
    env:
      PYTHON_EXE: C:\Users\abhiv\AppData\Local\Programs\Python\Python311\python.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: '& $env:PYTHON_EXE --version'

      - name: Check Git
        shell: powershell
        run: git --version

      - name: Check Docker
        shell: powershell
        run: docker info

      - name: Check Kubernetes
        shell: powershell
        run: kubectl get nodes

      - name: Check Project
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\src\mlops_pipeline\placement_prediction_pipeline.py")) {
            throw "Placement prediction project was not checked out."
          }
