name: Lab 9 - Failure and Recovery Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Lab 8 - MLOps CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read

jobs:
  failure-tests:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, placement-prediction]
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      PYTHON_EXE: C:\Users\abhiv\AppData\Local\Programs\Python\Python311\python.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) { throw "Python 3.11 was not found at $env:PYTHON_EXE" }
          & $env:PYTHON_EXE --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe"
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the normal MLOps pipeline
        shell: powershell
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe"
          & $python ".\src\mlops_pipeline\placement_prediction_pipeline.py" --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Lab 9 failure and recovery tests
        shell: powershell
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe"
          & $python ".\src\mlops_pipeline\10_failure_injection.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy placement API to Kubernetes
        shell: powershell
        run: |
          docker build -t placement-prediction-api:latest .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -f .\k8s\deployment.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -f .\k8s\service.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl rollout restart deployment/placement-api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl rollout status deployment/placement-api --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Lab 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab9-failure-tests-${{ github.run_number }}
          path: |
            reports/**
            artifacts/**
            logs/**
            outputs/**
          if-no-files-found: ignore
